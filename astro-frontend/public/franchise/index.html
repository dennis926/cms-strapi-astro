<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>招商合作 - 卿尔美</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700&family=Noto+Sans+SC:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Noto Sans SC',-apple-system,sans-serif;line-height:1.6;color:#1a1a2e;background:#fafbfc}
    .container{max-width:72rem;margin:0 auto;padding:0 1.5rem}
    header{position:sticky;top:0;z-index:50;background:rgba(250,251,252,0.92);backdrop-filter:blur(16px);border-bottom:1px solid rgba(0,0,0,0.06)}
    header nav{display:flex;align-items:center;justify-content:space-between;padding:1.25rem 0}
    header .logo{font-family:'Noto Serif SC',serif;font-size:1.75rem;font-weight:700;text-decoration:none;color:#1a1a2e;letter-spacing:0.05em}
    header ul{display:flex;gap:2.5rem;list-style:none}
    header ul a{text-decoration:none;color:#6b7280;font-size:0.95rem;font-weight:500;transition:all 0.2s}
    header ul a:hover{color:#3b82f6}
    .hero{padding:5rem 0;text-align:center;background:linear-gradient(135deg,#fafbff 0%,#f0f4ff 100%)}
    .hero h1{font-family:'Noto Serif SC',serif;font-size:clamp(2.5rem,6vw,4rem);font-weight:700;margin-bottom:1rem;color:#1a1a2e}
    .hero p{color:#6b7280;font-size:1.1rem}
    section{padding:4rem 0}
    .grid{display:grid;gap:2rem}
    .grid-3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
    .card{background:white;border-radius:1rem;padding:2rem;box-shadow:0 4px 6px -1px rgba(0,0,0,0.04);border:1px solid #f3f4f6;text-align:center}
    .card h3{font-size:1.1rem;font-weight:600;margin-bottom:0.5rem;color:#1a1a2e}
    .card p{color:#6b7280;font-size:0.9rem}
    footer{background:#f9fafb;border-top:1px solid #e5e7eb;padding:3rem 0;text-align:center;color:#9ca3af;font-size:0.875rem}
  </style>
</head>
<body>
  <header>
    <nav class="container">
      <a href="/" class="logo">卿尔美</a>
      <ul>
        <li><a href="/about">关于我们</a></li>
        <li><a href="/products">产品中心</a></li>
        <li><a href="/articles">健康资讯</a></li>
        <li><a href="/news">新闻动态</a></li>
        <li><a href="/franchise">招商合作</a></li>
        <li><a href="/contact">联系我们</a></li>
      </ul>
    </nav>
  </header>

  <section class="hero">
    <div class="container">
      <h1>招商合作</h1>
      <p>加入我们，共创健康事业</p>
    </div>
  </section>

  <section class="container">
    <div class="grid grid-3">
      <div class="card">
        <h3>品牌优势</h3>
        <p>知名品牌，市场认可度高</p>
      </div>
      <div class="card">
        <h3>产品优势</h3>
        <p>优质健康产品，市场竞争力强</p>
      </div>
      <div class="card">
        <h3>支持优势</h3>
        <p>全方位加盟支持，轻松创业</p>
      </div>
    </div>
  </section>

  <footer>
    <div class="container">
      <p>&copy; 2026 卿尔美 版权所有</p>
    </div>
  </footer>
</body>
</html>
