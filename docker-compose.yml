version: '3.8'

services:
  # Strapi 5 CMS
  strapi:
    build:
      context: ./strapi-backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=strapi
      - DATABASE_USERNAME=strapi
      - DATABASE_PASSWORD=strapi_password_here
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ADMIN_JWT_SECRET=your_admin_jwt_secret_here
      - JWT_SECRET=your_jwt_secret_here
      - APP_KEYS=key1,key2,key3,key4
      - API_TOKEN_SALT=your_api_token_salt_here
      - TRANSFER_TOKEN_SALT=your_transfer_token_salt_here
      - MEILISEARCH_HOST=http://meilisearch:7700
    ports:
      - "1337:1337"
    depends_on:
      - postgres
      - redis
      - meilisearch
    volumes:
      - strapi_uploads:/app/public/uploads
    networks:
      - cms-network
    restart: unless-stopped

  # PostgreSQL 16 数据库
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=strapi
      - POSTGRES_USER=strapi
      - POSTGRES_PASSWORD=strapi_password_here
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cms-network
    restart: unless-stopped

  # Redis 7 缓存
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - cms-network
    restart: unless-stopped

  # Meilisearch 全文搜索
  meilisearch:
    image: getmeili/meilisearch:v1
    ports:
      - "7700:7700"
    volumes:
      - meilisearch_data:/meili_data
    environment:
      - MEILI_MASTER_KEY=your_meilisearch_master_key
    networks:
      - cms-network
    restart: unless-stopped

  # Astro 前端
  frontend:
    build:
      context: ./astro-frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PUBLIC_API_URL=http://localhost:1337
      - PUBLIC_SITE_URL=http://localhost:3000
    depends_on:
      - strapi
    networks:
      - cms-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  strapi_uploads:
  meilisearch_data:

networks:
  cms-network:
    driver: bridge
